  <main class="main-wrapper">
    <header class="main-header">
      <h1 class="page-heading">Budget</h1>
      <button type="button" class="btn-add-task" id="openAddModalBtn">+Add Expense</button>
    </header>
    <div class="header-divider" aria-hidden="true"></div>

    <section class="main-body">
      <div class="summary-row">
        <div class="summary-card"><span class="summary-label">Total Budget</span><strong class="num" id="totalBudget">Rs. 0</strong></div>
        <div class="summary-card"><span class="summary-label">Total Spent</span><strong class="num" id="totalSpent">Rs. 0</strong></div>
        <div class="summary-card"><span class="summary-label">Remaining</span><strong class="num" id="remaining">Rs. 0</strong></div>
      </div>

      <div class="budget-grid">
        <div class="donut-wrap" role="img" aria-label="Percentage of budget used" id="donut">
          <svg viewBox="0 0 200 200">
            <circle class="donut-rest" cx="100" cy="100" r="80"/>
            <circle class="donut-used" id="donutUsed" cx="100" cy="100" r="80" stroke-dasharray="0 502.65"/>
          </svg>
          <div class="donut-center"><span class="num donut-pct" id="donutPct">0%</span><span class="donut-cap">Used</span></div>
        </div>

        <div class="tasks-card budget-card">
          <div class="tasks-table-wrapper">
            <table class="tasks-table budget-table">
              <thead>
                <tr>
                  <th scope="col">Category</th>
                  <th scope="col">Estimated(Rs.)</th>
                  <th scope="col">Actual(Rs.)</th>
                  <th scope="col" class="c">Paid</th>
                  <th scope="col" class="c">Action</th>
                </tr>
              </thead>
              <tbody id="budgetBody">
                <tr><td colspan="5" class="loading-row"><div class="loading-spinner"></div><p>Loading budget…</p></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-overlay" id="expenseModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
  <div class="modal-container">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Add Expense</h2>
      <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close dialog">&times;</button>
    </div>
    <form id="expenseForm" class="modal-form" novalidate>
      <div class="form-group">
        <label for="expCategory">Category *</label>
        <input type="text" id="expCategory" list="catOptions" maxlength="100" placeholder="e.g. Venue" required>
        <datalist id="catOptions">
          <option value="Venue"></option><option value="Catering"></option><option value="Photography"></option>
          <option value="Attire"></option><option value="Decorations"></option><option value="Entertainment"></option>
          <option value="Stationery"></option><option value="Transport"></option>
        </datalist>
      </div>
      <div class="form-row">
        <div class="form-group"><label for="expEstimated">Estimated (Rs.)</label>
          <input type="number" id="expEstimated" min="0" step="1" placeholder="0"></div>
        <div class="form-group"><label for="expActual">Actual (Rs.)</label>
          <input type="number" id="expActual" min="0" step="1" placeholder="0"></div>
      </div>
      <label class="paid-check"><input type="checkbox" id="expPaid"> Already paid</label>
      <div class="form-actions">
        <button type="button" class="btn-modal-cancel" id="cancelModalBtn">Cancel</button>
        <button type="submit" class="btn-modal-submit">Save expense</button>
      </div>
    </form>
  </div>
</div>

<div class="toast-msg" id="toastMsg" role="status" aria-live="polite"></div>
