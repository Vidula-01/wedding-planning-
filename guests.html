<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guests – Wedora</title>
  <meta name="description" content="Manage your wedding guest list with Wedora. Track RSVPs, invitations, and seating with ease." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/guests.css" />
  <link rel="stylesheet" href="css/app-shell.css">
</head>
<body>

<!-- ═══════════════════════ SIDEBAR ═══════════════════════ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <a href="dashboard.html" aria-label="WEDORA home">
      <img src="images/logo.png" alt="WEDORA - Plan Your Perfect Beginning">
    </a>
  </div>

  <nav class="sidebar-nav" aria-label="Dashboard navigation">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="wedding-details.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span>Wedding Details</span>
      </a>
      <a href="tasks.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 12h6M9 16h6"/></svg>
        <span>Tasks</span>
      </a>
      <a href="budget.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Budget</span>
      </a>
      <a href="vendors.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M9 20v-5h6v5"/></svg>
        <span>Vendors</span>
      </a>
      <a href="guests.html" class="nav-item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="9" r="2.5"/><path d="M15.5 20c.3-2.5 2-4.5 4.5-4.9"/></svg>
        <span>Guests</span>
      </a>
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span>Profile</span>
      </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="btn-logout" id="logoutBtn" title="Log out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Log out</span>
    </button>
  </div>
</aside>

<!-- ═══════════════════════ MAIN CONTENT ═══════════════════════ -->
<main class="main-content">

  <!-- Top bar -->
  <div class="page-topbar">
    <h1 class="page-title">Guests</h1>
    <button class="btn-add-guest" id="addGuestBtn">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add Guest
    </button>
  </div>

  <!-- Summary cards -->
  <div class="summary-grid" id="summaryGrid">
    <div class="summary-card">
      <div class="summary-icon icon-blue">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
      </div>
      <div class="summary-info">
        <span class="summary-label">Total Guests</span>
        <span class="summary-value" id="countTotal">–</span>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-icon icon-green">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      </div>
      <div class="summary-info">
        <span class="summary-label">Confirmed</span>
        <span class="summary-value" id="countConfirmed">–</span>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-icon icon-pink">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="summary-info">
        <span class="summary-label">Pending</span>
        <span class="summary-value" id="countPending">–</span>
      </div>
    </div>
    <div class="summary-card">
      <div class="summary-icon icon-orange">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg>
      </div>
      <div class="summary-info">
        <span class="summary-label">Not Attending</span>
        <span class="summary-value" id="countNotAttending">–</span>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" class="filter-input search-input" placeholder="Search guest..." />
    </div>
    <select id="filterSide" class="filter-input filter-select">
      <option value="All Side">All Side</option>
      <option value="Bride Side">Bride Side</option>
      <option value="Groom Side">Groom Side</option>
      <option value="Both">Both</option>
    </select>
    <select id="filterStatus" class="filter-input filter-select">
      <option value="All Status">All Status</option>
      <option value="Confirmed">Confirmed</option>
      <option value="Pending">Pending</option>
      <option value="Not Attending">Not Attending</option>
    </select>
    <select id="filterCategory" class="filter-input filter-select">
      <option value="All Category">All Category</option>
      <option value="Family">Family</option>
      <option value="Friend">Friend</option>
      <option value="Colleague">Colleague</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table class="guest-table" id="guestTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Side</th>
          <th>Category</th>
          <th>Invitation</th>
          <th>RSVP</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="guestTableBody">
        <tr class="loading-row"><td colspan="6">Loading guests...</td></tr>
      </tbody>
    </table>
  </div>

</main>

<!-- ═══════════════════════ ADD / EDIT MODAL ═══════════════════════ -->
<div class="modal-backdrop" id="guestModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Add Guest</h2>
      <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close">&#x2715;</button>
    </div>
    <form class="modal-body" id="guestForm" novalidate>
      <input type="hidden" id="guestId" />

      <div class="form-row two-col">
        <div class="form-field">
          <label for="fieldName">Full Name *</label>
          <input type="text" id="fieldName" placeholder="e.g. Mr. Sunil Fernando" required />
          <span class="field-error" id="errName"></span>
        </div>
        <div class="form-field">
          <label for="fieldPhone">Phone</label>
          <input type="tel" id="fieldPhone" placeholder="0771234567" />
        </div>
      </div>

      <div class="form-row two-col">
        <div class="form-field">
          <label for="fieldEmail">Email</label>
          <input type="email" id="fieldEmail" placeholder="guest@example.com" />
        </div>
        <div class="form-field">
          <label for="fieldSide">Side</label>
          <select id="fieldSide">
            <option value="Bride Side">Bride Side</option>
            <option value="Groom Side">Groom Side</option>
            <option value="Both">Both</option>
          </select>
        </div>
      </div>

      <div class="form-row two-col">
        <div class="form-field">
          <label for="fieldCategory">Category</label>
          <select id="fieldCategory">
            <option value="Family">Family</option>
            <option value="Friend">Friend</option>
            <option value="Colleague">Colleague</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-field">
          <label for="fieldInvitation">Invitation</label>
          <select id="fieldInvitation">
            <option value="Not Sent">Not Sent</option>
            <option value="Sent">Sent</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="fieldRsvp">RSVP</label>
          <select id="fieldRsvp">
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Not Attending">Not Attending</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="fieldNotes">Notes</label>
          <textarea id="fieldNotes" rows="2" placeholder="Any additional notes..."></textarea>
        </div>
      </div>

      <div class="form-alert" id="formAlert"></div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save" id="saveBtn">Save Guest</button>
      </div>
    </form>
  </div>
</div>

<!-- ═══════════════════════ DELETE CONFIRM MODAL ═══════════════════════ -->
<div class="modal-backdrop" id="deleteModal" role="dialog" aria-modal="true">
  <div class="modal-card confirm-card">
    <div class="modal-header">
      <h2 class="modal-title">Delete Guest?</h2>
      <button class="modal-close-btn" id="deleteCloseBtn" aria-label="Close">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p class="confirm-text">Are you sure you want to remove <strong id="deleteGuestName"></strong> from the guest list? This cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="deleteCancelBtn">Cancel</button>
        <button type="button" class="btn-delete" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script src="js/guests.js"></script>
</body>
</html>
