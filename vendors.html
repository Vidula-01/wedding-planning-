<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendors | WEDORA</title>
  <meta name="description" content="Manage your wedding vendors — photography, venue, catering, decorations, florists and more.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/vendors.css">
  <link rel="stylesheet" href="css/app-shell.css">
</head>

<body>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <a href="dashboard.html" aria-label="WEDORA home">
      <img src="images/logo.png" alt="WEDORA - Plan Your Perfect Beginning">
    </a>
  </div>

  <nav class="sidebar-nav" aria-label="Dashboard navigation">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="wedding-details.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span>Wedding Details</span>
      </a>
      <a href="tasks.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 12h6M9 16h6"/></svg>
        <span>Tasks</span>
      </a>
      <a href="budget.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Budget</span>
      </a>
      <a href="vendors.html" class="nav-item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M9 20v-5h6v5"/></svg>
        <span>Vendors</span>
      </a>
      <a href="guests.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="9" r="2.5"/><path d="M15.5 20c.3-2.5 2-4.5 4.5-4.9"/></svg>
        <span>Guests</span>
      </a>
      <a href="profile.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span>Profile</span>
      </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="btn-logout" id="logoutBtn" title="Log out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Log out</span>
    </button>
  </div>
</aside>

  <!-- ===== Main content ===== -->
  <main class="content">
    <div class="content-header">
      <h1 class="page-title">Vendors</h1>
      <button type="button" class="btn-add" id="openAddModal">
        <span>+</span> Add Vendor
      </button>
    </div>

    <div class="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="text" id="searchInput" placeholder="Search Vendors......" autocomplete="off">
    </div>

    <div class="category-tabs" id="categoryTabs">
      <button type="button" class="tab-pill active" data-category="All">All</button>
      <button type="button" class="tab-pill" data-category="Photography">Photography</button>
      <button type="button" class="tab-pill" data-category="Venue">Venue</button>
      <button type="button" class="tab-pill" data-category="Catering">Catering</button>
      <button type="button" class="tab-pill" data-category="Decorations">Decorations</button>
      <button type="button" class="tab-pill" data-category="Florist">Florist</button>
      <button type="button" class="tab-pill" data-category="Others">Others</button>
    </div>

    <div class="table-wrap">
      <table class="vendor-table">
        <thead>
          <tr>
            <th>Vendor</th>
            <th>Category</th>
            <th>Contact</th>
            <th>Price (Rs.)</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="vendorTableBody">
          <tr><td colspan="5" class="table-loading">Loading vendors…</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- ===== Add / Edit Vendor Modal ===== -->
  <div class="modal-backdrop" id="vendorModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="vendorModalTitle">
      <h2 class="modal-title" id="vendorModalTitle">Add Vendor</h2>

      <form id="vendorForm" novalidate>
        <input type="hidden" id="vendorId" name="id">

        <div class="modal-field">
          <label for="vendorName">Vendor Name</label>
          <input type="text" id="vendorName" name="name" placeholder="e.g. Dream Studio" maxlength="150">
          <p class="field-error" id="err-name"></p>
        </div>

        <div class="modal-field">
          <label for="vendorCategory">Category</label>
          <select id="vendorCategory" name="category">
            <option value="">Select a category</option>
            <option value="Photography">Photography</option>
            <option value="Videography">Videography</option>
            <option value="Venue">Venue</option>
            <option value="Catering">Catering</option>
            <option value="Decorations">Decorations</option>
            <option value="Florist">Florist</option>
            <option value="Others">Others</option>
          </select>
          <p class="field-error" id="err-category"></p>
        </div>

        <div class="modal-field">
          <label for="vendorContact">Contact Number</label>
          <input type="text" id="vendorContact" name="contact" placeholder="e.g. 077 123 4567" maxlength="30">
          <p class="field-error" id="err-contact"></p>
        </div>

        <div class="modal-field">
          <label for="vendorPrice">Price (Rs.)</label>
          <input type="number" id="vendorPrice" name="price" placeholder="e.g. 150000" min="0" step="0.01">
          <p class="field-error" id="err-price"></p>
        </div>

        <div class="modal-field">
          <label for="vendorNotes">Notes (optional)</label>
          <textarea id="vendorNotes" name="notes" placeholder="Any extra detail about this vendor"></textarea>
        </div>

        <div class="modal-alert" id="vendorFormAlert" role="alert"></div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelVendorModal">Cancel</button>
          <button type="submit" class="btn-primary" id="saveVendorBtn">Save Vendor</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== View Vendor Modal ===== -->
  <div class="modal-backdrop" id="viewModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="viewModalTitle">
      <h2 class="modal-title" id="viewModalTitle">Vendor Details</h2>
      <div id="viewModalBody"></div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="closeViewModal">Close</button>
      </div>
    </div>
  </div>

  <script src="js/vendors.js"></script>
</body>

</html>
