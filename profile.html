<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | WEDORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/app-shell.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <a href="dashboard.html" aria-label="WEDORA home">
      <img src="images/logo.png" alt="WEDORA - Plan Your Perfect Beginning">
    </a>
  </div>

  <nav class="sidebar-nav" aria-label="Dashboard navigation">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="wedding-details.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>
        <span>Wedding Details</span>
      </a>
      <a href="tasks.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a1 1 0 0 1 1 1v2H8V4a1 1 0 0 1 1-1z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 12h6M9 16h6"/></svg>
        <span>Tasks</span>
      </a>
      <a href="budget.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Budget</span>
      </a>
      <a href="vendors.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l1.5-5h15L21 9"/><rect x="4" y="9" width="16" height="11" rx="1"/><path d="M9 20v-5h6v5"/></svg>
        <span>Vendors</span>
      </a>
      <a href="guests.html" class="nav-item">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="18" cy="9" r="2.5"/><path d="M15.5 20c.3-2.5 2-4.5 4.5-4.9"/></svg>
        <span>Guests</span>
      </a>
      <a href="profile.html" class="nav-item is-active" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        <span>Profile</span>
      </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="btn-logout" id="logoutBtn" title="Log out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span>Log out</span>
    </button>
  </div>
</aside>
  <main class="profile-main">
    <div id="dashStatus" class="dash-status">Loading your profile…</div>
    <section id="dashBody" class="profile-page" style="display:none;">
      <h1>Profile</h1>
      <div class="profile-layout">
        <section class="profile-photo-column">
          <div class="profile-photo-frame">
            <img id="profilePhoto" src="images/profile-default.png" alt="Profile photo">
          </div>
          <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
          <button type="button" class="profile-photo-btn" id="changePhotoBtn">
            <svg viewBox="0 0 24 24"><path d="M4 7h4l1.5-2h5L16 7h4a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            Change Photo
          </button>
          <div id="photoStatus" class="photo-status"></div>
        </section>

        <section class="profile-form-column">
          <form id="profileForm" novalidate>
            <div class="profile-field">
              <label for="fullName">Full Name</label>
              <input id="fullName" name="full_name" type="text" autocomplete="name" required>
              <div class="field-error" id="err_full_name"></div>
            </div>
            <div class="profile-field">
              <label for="email">Email Address</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
              <div class="field-error" id="err_email"></div>
            </div>
            <div class="profile-field">
              <label for="phone">Phone Number</label>
              <input id="phone" name="phone" type="tel" autocomplete="tel" required>
              <div class="field-error" id="err_phone"></div>
            </div>
            <div class="profile-field">
              <label for="address">Address</label>
              <textarea id="address" name="address" autocomplete="street-address" rows="3" maxlength="255" placeholder="Enter your address"></textarea>
              <div class="field-error" id="err_address"></div>
            </div>
            <div class="profile-field">
              <label for="dateOfBirth">Date of Birth</label>
              <input id="dateOfBirth" name="date_of_birth" type="date" autocomplete="bday">
              <div class="field-error" id="err_date_of_birth"></div>
            </div>

            <button type="button" class="password-toggle" id="changePasswordBtn">
              <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              Change Password
            </button>

            <button type="submit" class="profile-save-btn" id="saveProfileBtn">
              <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
              Save Changes
            </button>
            <div id="profileStatus" class="form-status"></div>
          </form>

          <form id="passwordForm" class="password-form" novalidate hidden>
            <h2>Change Password</h2>
            <div class="profile-field"><label for="currentPassword">Current Password</label><input id="currentPassword" name="current_password" type="password" autocomplete="current-password"><div class="field-error" id="err_current_password"></div></div>
            <div class="profile-field"><label for="newPassword">New Password</label><input id="newPassword" name="new_password" type="password" autocomplete="new-password"><div class="field-error" id="err_new_password"></div></div>
            <div class="profile-field"><label for="confirmPassword">Confirm New Password</label><input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password"><div class="field-error" id="err_confirm_password"></div></div>
            <div class="password-actions">
              <button type="submit" class="profile-save-btn" id="savePasswordBtn">Update Password</button>
              <button type="button" class="password-cancel" id="cancelPasswordBtn">Cancel</button>
            </div>
            <div id="passwordStatus" class="form-status"></div>
          </form>
        </section>
      </div>
    </section>
  </main>
  <script src="js/profile.js"></script>
</body>
</html>
