<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks | WEDORA</title>
  <meta name="description" content="Plan and track your wedding tasks effortlessly with WEDORA.">

  <!-- Google Fonts: Inter & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/tasks.css">
</head>

<body>
  <div class="app-container">

    <!-- ==========================================================
         SIDEBAR NAVIGATION
         ========================================================== -->
    <aside class="sidebar">
      <!-- Logo -->
      <a href="tasks.html" class="sidebar-logo" aria-label="WEDORA home">
        <img src="images/logo.png" alt="WEDORA - Plan Your Perfect Beginning">
      </a>

      <!-- Menu Items -->
      <nav class="sidebar-menu" aria-label="Sidebar Menu">
        <!-- Dashboard -->
        <a href="dashboard.html" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span>Dashboard</span>
        </a>

        <!-- Wedding Details -->
        <a href="#wedding-details" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
            <circle cx="8" cy="14" r="1" fill="currentColor" />
            <circle cx="12" cy="14" r="1" fill="currentColor" />
            <circle cx="16" cy="14" r="1" fill="currentColor" />
            <circle cx="8" cy="18" r="1" fill="currentColor" />
            <circle cx="12" cy="18" r="1" fill="currentColor" />
            <circle cx="16" cy="18" r="1" fill="currentColor" />
          </svg>
          <span>Wedding Details</span>
        </a>

        <!-- Tasks (ACTIVE) -->
        <a href="tasks.html" class="menu-item active" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
            <path d="M9 13.5l2 2 4-4" />
          </svg>
          <span>Tasks</span>
        </a>

        <!-- Budget -->
        <a href="#budget" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 6v12M15 9.5c0-1.5-1.3-2.5-3-2.5s-3 1-3 2.5c0 3 6 1.5 6 4.5s-1.3 2.5-3 2.5-3-1-3-2.5" />
          </svg>
          <span>Budget</span>
        </a>

        <!-- Vendors -->
        <a href="#vendors" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9l2-5h14l2 5" />
            <path d="M21 9v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9" />
            <path d="M9 22V12h6v10" />
          </svg>
          <span>Vendors</span>
        </a>

        <!-- Guests -->
        <a href="#guests" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          <span>Guests</span>
        </a>

        <!-- Profile -->
        <a href="#profile" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span>Profile</span>
        </a>

        <!-- FQA -->
        <a href="#faq" class="menu-item">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5" />
          </svg>
          <span>FQA</span>
        </a>
      </nav>

      <!-- Bottom Log out button -->
      <div class="sidebar-footer">
        <a href="login.html" class="btn-logout" id="logoutBtn" title="Log out">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Log out</span>
        </a>
      </div>
    </aside>

    <!-- ==========================================================
         MAIN CONTENT AREA
         ========================================================== -->
    <main class="main-wrapper">
      
      <!-- Top Section: Header & +Add Task Button -->
      <header class="main-header">
        <h1 class="page-heading">Tasks</h1>
        <button type="button" class="btn-add-task" id="openAddModalBtn">
          <span>+Add Task</span>
        </button>
      </header>

      <!-- Full-Width Divider -->
      <div class="header-divider" aria-hidden="true"></div>

      <!-- Main Body: Filter Tabs & Tasks Table Card -->
      <section class="main-body">
        
        <!-- Filter Tabs -->
        <div class="filter-bar" role="tablist" aria-label="Task status filters">
          <button type="button" class="filter-tab active" data-filter="All" role="tab" aria-selected="true">All</button>
          <button type="button" class="filter-tab" data-filter="To Do" role="tab" aria-selected="false">To Do</button>
          <button type="button" class="filter-tab" data-filter="In Progress" role="tab" aria-selected="false">In Progress</button>
          <button type="button" class="filter-tab" data-filter="Completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <!-- Rounded Tasks Table Container Card -->
        <div class="tasks-card">
          <div class="tasks-table-wrapper">
            <table class="tasks-table" id="tasksTable">
              <thead>
                <tr>
                  <th scope="col" style="width: 26%;">Task</th>
                  <th scope="col" style="width: 18%;">Category</th>
                  <th scope="col" style="width: 18%;">Due Date</th>
                  <th scope="col" style="width: 14%;">Priority</th>
                  <th scope="col" style="width: 14%;">Status</th>
                  <th scope="col" style="width: 10%;">Action</th>
                </tr>
              </thead>
              <tbody id="tasksTableBody">
                <!-- Dynamically populated via js/tasks.js -->
                <tr>
                  <td colspan="6" class="loading-row">
                    <div class="loading-spinner"></div>
                    <p>Loading tasks…</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </section>

    </main>

  </div>

  <!-- ==========================================================
       MODAL: ADD / EDIT TASK
       ========================================================== -->
  <div class="modal-overlay" id="taskModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="modal-container">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add New Task</h2>
        <button type="button" class="modal-close" id="closeModalBtn" aria-label="Close dialog">&times;</button>
      </div>

      <form id="taskForm" class="modal-form" novalidate>
        <input type="hidden" id="taskId" name="id" value="">

        <!-- Task Title -->
        <div class="form-group">
          <label for="taskTitle">Task Title *</label>
          <input type="text" id="taskTitle" name="title" placeholder="e.g. Order Wedding Cake" required maxlength="200">
        </div>

        <!-- Category & Due Date -->
        <div class="form-row">
          <div class="form-group">
            <label for="taskCategory">Category</label>
            <input type="text" id="taskCategory" name="category" list="categoryOptions" placeholder="e.g. Food, Venue" required>
            <datalist id="categoryOptions">
              <option value="Venue"></option>
              <option value="Photography"></option>
              <option value="Food"></option>
              <option value="Stationery"></option>
              <option value="Attire"></option>
              <option value="Entertainment"></option>
              <option value="Decoration"></option>
              <option value="General"></option>
            </datalist>
          </div>

          <div class="form-group">
            <label for="taskDueDate">Due Date</label>
            <input type="date" id="taskDueDate" name="due_date">
          </div>
        </div>

        <!-- Priority & Status -->
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskStatus">Status</label>
            <select id="taskStatus" name="status">
              <option value="To Do" selected>To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
        </div>

        <!-- Notes (optional) -->
        <div class="form-group">
          <label for="taskNotes">Notes / Description (optional)</label>
          <textarea id="taskNotes" name="notes" rows="3" placeholder="Add any details or vendor contact..."></textarea>
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <button type="button" class="btn-modal-cancel" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-modal-submit" id="saveTaskBtn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Message -->
  <div class="toast-msg" id="toastMsg" role="status" aria-live="polite"></div>

  <!-- Main JavaScript File -->
  <script src="js/tasks.js"></script>
</body>

</html>
